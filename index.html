<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Squad Vault</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0a0a0a;
      font-family: monospace;
      color: #00ff88;
      min-height: 100vh;
      position: relative;
    }

    #rain-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #content {
      position: relative;
      z-index: 2;
      max-width: 900px;
      width: 90%;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.5);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    h1 {
      font-size: 3.2em;
      margin-bottom: 20px;
      text-shadow: 0 0 15px #00ff88;
    }

    p {
      font-size: 1.3em;
      margin-bottom: 30px;
    }

    #address-section {
      margin: 20px 0; /* Reduced spacing */
    }

    #address-label {
      font-size: 1.4em;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #00ff88;
    }

    #address-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    code {
      background: rgba(0, 255, 136, 0.1);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid #00ff88;
      font-size: 1.1em;
      word-break: break-all;
    }

    #copy-button {
      padding: 8px 16px;
      font-size: 1.0em;
      background: transparent;
      color: #00ff88;
      border: 2px solid #00ff88;
      border-radius: 8px;
      cursor: pointer;
      text-shadow: 0 0 10px #00ff88;
      box-shadow: 0 0 10px #00ff88;
      transition: all 0.3s;
    }

    #copy-button:hover {
      background: #00ff88;
      color: #0a0a0a;
    }

    #copy-feedback {
      font-size: 1.0em;
      opacity: 0;
      transition: opacity 0.5s;
    }

    button.dashboard {
      padding: 14px 36px;
      font-size: 1.4em;
      background: transparent;
      color: #00ff88;
      border: 2px solid #00ff88;
      border-radius: 8px;
      cursor: pointer;
      margin: 30px auto;
      text-shadow: 0 0 15px #00ff88;
      transition: all 0.3s;
      box-shadow: 0 0 15px #00ff88;
      display: inline-block;
    }

    button.dashboard:hover {
      background: #00ff88;
      color: #0a0a0a;
      text-shadow: none;
      box-shadow: 0 0 30px #00ff88;
    }

    @media (max-width: 768px) {
      h1 { font-size: 2.4em; }
      p { font-size: 1.1em; }
      #content { padding: 40px 20px; }
      #address-section { margin: 15px 0; }
      #address-label { font-size: 1.2em; margin-bottom: 8px; }
      #address-container { flex-direction: column; gap: 12px; }
      button.dashboard { font-size: 1.2em; padding: 12px 28px; }
      #copy-button { font-size: 0.9em; padding: 6px 12px; }
    }
  </style>
</head>
<body>
  <canvas id="rain-canvas"></canvas>

  <div id="content">
    <h1>The Squad Vault</h1>
    <p>Squad solana vault for the chat. Send via wallet</p>

    <div id="address-section">
      <div id="address-label">Vault Address:</div>
      <div id="address-container">
        <code id="address">3gtctQdU2B99KecmJPb3Rj7zQnaAof8XvTeTedh5q9cy</code>
        <button id="copy-button">Copy</button>
        <span id="copy-feedback">Copied ✔</span>
      </div>
    </div>

    <button class="dashboard" onclick="window.open('https://app.squads.so/squads/3gtctQdU2B99KecmJPb3Rj7zQnaAof8XvTeTedh5q9cy/home', '_blank')">View the Vault Dashboard</button>
  </div>

  <script>
    // Matrix Rain (calm, full-screen)
    const rainCanvas = document.getElementById('rain-canvas');
    const ctx = rainCanvas.getContext('2d');
    rainCanvas.width = window.innerWidth;
    rainCanvas.height = window.innerHeight;

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:\'",.<>?/～!！@#￥%……&*（）——+【】｛｝；：＂＇，。、《》？';
    const fontSize = 14;
    let columns = rainCanvas.width / fontSize;
    let drops = Array(Math.floor(columns)).fill(1);

    function drawRain() {
      ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
      ctx.fillRect(0, 0, rainCanvas.width, rainCanvas.height);

      ctx.fillStyle = '#00ff88';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > rainCanvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }

    drawRain();
    setInterval(drawRain, 45);

    window.addEventListener('resize', () => {
      rainCanvas.width = window.innerWidth;
      rainCanvas.height = window.innerHeight;
      columns = rainCanvas.width / fontSize;
      drops = Array(Math.floor(columns)).fill(1);
    });

    // Copy button
    const copyButton = document.getElementById('copy-button');
    const copyFeedback = document.getElementById('copy-feedback');
    const vaultAddress = "3gtctQdU2B99KecmJPb3Rj7zQnaAof8XvTeTedh5q9cy";

    copyButton.addEventListener('click', () => {
      navigator.clipboard.writeText(vaultAddress).then(() => {
        copyFeedback.style.opacity = 1;
        setTimeout(() => {
          copyFeedback.style.opacity = 0;
        }, 2000);
      });
    });
  </script>
</body>
</html>
